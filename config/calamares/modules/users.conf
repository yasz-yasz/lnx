---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: sudo
    must_exist: true
    system: true
  - name: adm
    must_exist: false
    system: true
  - name: cdrom
    must_exist: false
    system: true
  - name: dip
    must_exist: false
    system: true
  - name: plugdev
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: netdev
    must_exist: false
    system: true

autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash