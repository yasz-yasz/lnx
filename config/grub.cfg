set default=0
set timeout=5

menuentry "LNX by YAS - Live RAM Mode (Puppy Style - Super Cepat)" {
    linux /casper/vmlinuz boot=casper toram quiet splash ---
    initrd /casper/initrd
}

menuentry "LNX by YAS - Live Mode (Normal / RAM Rendah)" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

menuentry "LNX by YAS - Safe Graphics Mode" {
    linux /casper/vmlinuz boot=casper nomodeset ---
    initrd /casper/initrd
}