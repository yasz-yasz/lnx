name: Build Custom Linux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      os_name:
        description: 'Nama Custom OS'
        required: false
        default: 'CustomLinuxOS'
      debian_release:
        description: 'Basis Rilis Debian (bookworm / trixie)'
        required: false
        default: 'bookworm'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Live-Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso syslinux-utils isolinux debian-archive-keyring

      - name: Make Scripts Executable
        run: |
          chmod +x build.sh
          chmod +x config/hooks/live/*.hook.chroot || true
          chmod +x config/includes.chroot/usr/local/bin/* || true

      - name: Build Custom Linux ISO
        env:
          OS_NAME: ${{ github.event.inputs.os_name || 'CustomLinuxOS' }}
          DEBIAN_RELEASE: ${{ github.event.inputs.debian_release || 'bookworm' }}
        run: |
          sudo -E ./build.sh

      - name: Prepare Release Artifact
        run: |
          mkdir -p release_output
          mv *.iso release_output/
          cd release_output
          sha256sum *.iso > SHA256SUMS.txt
          ls -lh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-linux-iso
          path: release_output/*
          retention-days: 7

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Custom Linux ISO Build #${{ github.run_number }}
          files: release_output/*
          
